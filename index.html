<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Common Side Styling */
        .side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: flex 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            text-align: center;
            padding: 40px;
            text-decoration: none;
            cursor: pointer;
        }

        /* 1. CLEAN SIDE */
        .clean-side {
            background-color: #ffffff;
            color: #1d1d1f;
        }

        .clean-side:hover {
            flex: 1.5;
            background-color: #f5f5f7;
        }

        .clean-side h2 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }

        .btn-clean {
            padding: 15px 40px;
            background: #0071e3;
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        /* 2. LUXURY SIDE */
        .luxury-side {
            background-color: #0a0a0a;
            color: #c5a059;
            border-left: 1px solid #222;
        }

        .luxury-side:hover {
            flex: 1.5;
            background-color: #000;
        }

        .luxury-side h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-style: italic;
            margin-bottom: 20px;
        }

        .btn-luxury {
            padding: 15px 40px;
            border: 1px solid #c5a059;
            color: #c5a059;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            transition: 0.5s;
        }

        .btn-luxury:hover {
            background: #c5a059;
            color: #000;
        }

        /* Center Divider Text */
        .or-circle {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            color: #000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 0.7rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            z-index: 10;
            border: 2px solid #000;
        }

        @media (max-width: 768px) {
            .wrapper { flex-direction: column; }
            .or-circle { display: none; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="or-circle">OR</div>

        <a href="clean.html" class="side clean-side">
            <h2>Minimal.</h2>
            <p style="color: #86868b; margin-bottom: 30px;">Simple, Modern, and Fast.</p>
            <span class="btn-clean">Enter Clean Mode</span>
        </a>

        <a href="luxury.html" class="side luxury-side">
            <h2>Premium.</h2>
            <p style="color: #555; margin-bottom: 30px;">Elegant, Bold, and Timeless.</p>
            <span class="btn-luxury">Enter Luxury Mode</span>
        </a>
    </div>

</body>
</html>
